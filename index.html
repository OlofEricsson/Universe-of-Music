<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"

  <title>Universe of Music</title>

<body>
  <header>
    <h1>UNIVERSE of MUSIC</h1>

  <div class="row justify-content-center">
    <div class="card" style="width: auto;">
      <div class="card-body">
        <h5 class="card-title">Classical</h5>
        <p class="card-text"></p>
        
        <section class="visualizer">
          <canvas></canvas>
          <audio src='/MISC/images/audio/AntonioVivaldi_Presto.mp3' crossorigin='anonymous' controls></audio>
        </section>

      </div>
    </div>

    <div class="card " style="width: auto;">
      <div class="card-body">
        <h5 class="card-title">Pop</h5>
        <p class="card-text"></p>

        <section class="visualizer">
          <canvas></canvas>
          <audio src='/MISC/images/audio/AntonioVivaldi_Presto.mp3' crossorigin='anonymous' controls></audio>
        </section>
      </div>
    </div>

    <div class="card " style="width: auto;">
      <div class="card-body">
        <h5 class="card-title">Hardstyle</h5>
        <p class="card-text"></p>

        <section class="visualizer">
          <canvas></canvas>
          <audio src='/MISC/images/audio/AntonioVivaldi_Presto.mp3' crossorigin='anonymous' controls></audio>
        </section>
      </div>
    </div>

    <div class="card " style="width: auto;">
      <div class="card-body">
        <h5 class="card-title">Hip Hop</h5>
        <p class="card-text"></p>

        <section class="visualizer">
          <canvas></canvas>
          <audio src='/MISC/images/audio/AntonioVivaldi_Presto.mp3' crossorigin='anonymous' controls></audio>
        </section>
      </div>
    </div>
  </div>

  <section class="circle" id="classiccircle">

  </section>
  <section class="circle" id="popcircle">
    
  </section>
  <section class="circle" id="hardstylecircle">
    
  </section>
  <section class="circle" id="hiphopcircle">
    
  </section>

  <img src="/MISC/images/mountains2transparent.png" id="mountains">

  <script src="/JS/index.js"></script>

</html>
